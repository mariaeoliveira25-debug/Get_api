<!DOCTYPE html>
<html lang="pt-BR">
 <head>
     <meta charset="UTF-8" />
     <title>Lista de Animes</title>
     <link rel="stylesheet" href="../css/get.css" />
     <script src="../js/get.js" defer></script>
</head>
    <body>
     <header>
        <h1>Lista de Animes</h1>
        <p>Veja abaixo a lista de animes !!</p>
         </header>
         <main>
        <p><a href="../index.html"> Voltar para o cadastro</a></p>
          <section id="container-titulo-lista">
            <h2 id="titulo-lista">Animes cadastrados</h2>
            <p>Os animes são exibidos automaticamente ao abrir a página</p>
            <p id="resposta"></p>
            <ul id="lista-animes"></ul>
         </section>
         </main>
        <template id="modelo-anime">
            <li>
                <section class="card-capa">
                    <img class="imagem-anime" alt=""/>
                </section>
                <section class="card-conteudo">
                    <h3 class="nome"></h3>
                         <p><strong>Gênero:</strong> <span class="genero"> </span></p>
                         <p><strong>Numero_episodios:</strong> <span class="numero_episodios"> </span></p>
                         <p><strong>Ano_lancamento:</strong> <span class="ano_lancamento"> </span></p>
                         <p><strong>Estúdio:</strong> <span class="estudio"> </span></p>
                </section>
            </li>
        </template>
    </body>
</html>
